[project]
name = "avito-recsys-2026"
version = "0.1.0"
description = "AvitoTech RecSys 2026"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.9",
    "pyarrow>=17.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "catboost>=1.2",
    "lightgbm>=4.5",
    "torch>=2.4",
    "pyyaml>=6.0",
    "typer>=0.12",
    "psutil>=6.0",
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]